# Real lifecycle, fixed mock commands, one nginx task. No API keys needed.
schema_version: 1
proposer:
  provider: mock
  model: fixture-proposer-v1
  mock_fixture: ../fixtures/smoke-output-cap-proposer.json
  temperature: 0.0
  top_p: 1.0
  max_tokens: 1024
  timeout_seconds: 30.0
  retries: 0
  invalid_json_retries: 1
  api_key_env: OPENAI_API_KEY
homogeneous_auditor:
  provider: mock
  model: fixture-auditor-v1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 1024
  timeout_seconds: 30.0
  retries: 0
  invalid_json_retries: 1
  api_key_env: OPENAI_API_KEY
heterogeneous_auditor:
  provider: mock
  model: fixture-auditor-v1
  temperature: 0.0
  top_p: 1.0
  max_tokens: 1024
  timeout_seconds: 30.0
  retries: 0
  invalid_json_retries: 1
  api_key_env: GEMINI_API_KEY
runtime:
  backend: lxd
  template: vice-template
  snapshot: base
  profile: vicesysadmin
  storage_pool: default
  bridge: lxdbr0
  user: agent
  working_directory: /home/agent
limits:
  max_steps: 20
  max_tokens: 50000
  cost_cap: 1.0
  total_time_seconds: 600.0
  command_timeout_seconds: 30.0
  output_byte_cap: 256
  cleanup_timeout_seconds: 10.0
policy:
  enabled: true
  reject_command_chaining: true
  forbidden_commands: [mkfs, reboot, poweroff]
  high_risk_commands: [sudo, rm, chmod, chown, ufw, iptables, nft]
  forbidden_patterns: ['\brm\s+-rf\s+/\s*$']
  read_only_commands: [id, whoami, pwd, ls, cat, head, tail, grep, ss, stat, wc, df, du, ps, uname, systemctl, journalctl]
experiment:
  task_ids: [t1-2-restart-failed-service]
  conditions: [A]
  repetitions: 1
  seed: 20260927
  auditor_mode: blind
  human_in_the_loop: true
  state_snapshot_commands: ['id', 'ss -lnt']
pricing:
  fixture-proposer-v1:
    input_per_million: 0.0
    output_per_million: 0.0
  fixture-auditor-v1:
    input_per_million: 0.0
    output_per_million: 0.0
prompt_version: v1
